<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GenNS — claim your name onchain</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><text y=%2224%22 font-size=%2226%22>🔥</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="ember-field" aria-hidden="true"></div>

<header class="site-header">
  <div class="header-inner">
    <a href="#/" class="brand" data-nav>
      <span class="brand-mark">🔥</span>
      <span class="brand-name">GenNS</span>
    </a>
    <nav class="main-nav" id="mainNav">
      <a href="#/" data-nav>Search</a>
      <a href="#/names" data-nav>My names</a>
      <a href="#/learn" data-nav>How it works</a>
    </nav>
    <div class="header-actions">
      <button class="btn btn-ghost" id="navMenuToggle" aria-label="Toggle menu" aria-expanded="false">
        <span class="burger"></span>
      </button>
      <button class="btn btn-wallet" id="walletBtn"></button>
    </div>
  </div>
</header>

<main id="app" role="main"></main>

<footer class="site-footer">
  <div class="footer-inner">
    <div class="footer-brand">
      <span class="brand-mark">🔥</span>
      <span class="brand-name">GenNS</span>
      <p>Onchain names for wallets, sites, and everything you build.</p>
    </div>
    <div class="footer-links">
      <div class="footer-col">
        <h4>Product</h4>
        <a href="#/" data-nav>Search names</a>
        <a href="#/names" data-nav>Dashboard</a>
        <a href="#/learn" data-nav>How it works</a>
      </div>
      <div class="footer-col">
        <h4>Resources</h4>
        <a href="#/learn" data-nav>Documentation</a>
        <a href="#/learn" data-nav>Pricing</a>
        <a href="#/learn" data-nav>FAQ</a>
      </div>
      <div class="footer-col">
        <h4>Community</h4>
        <a href="#" onclick="return false">X / Twitter</a>
        <a href="#" onclick="return false">Discord</a>
        <a href="#" onclick="return false">Github</a>
      </div>
    </div>
  </div>
</footer>

<div class="toast-stack" id="toastStack" aria-live="polite"></div>

<!-- ============ TEMPLATES ============ -->

<template id="tpl-home">
  <section class="hero">
    <div class="hero-inner">
      <h1 class="hero-title">A name for everything<br>you own onchain.</h1>
      <p class="hero-sub">Search, claim, and manage a human-readable identity — one name for your wallet, your site, and every app you connect.</p>
      <form class="search-form" id="searchForm" autocomplete="off">
        <div class="search-box">
          <svg class="search-icon" width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="9" cy="9" r="6.5" stroke="currentColor" stroke-width="1.6"/><path d="M14 14L18 18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <input type="text" id="searchInput" placeholder="Search for a name" spellcheck="false">
          <span class="search-suffix">.gen</span>
        </div>
        <div class="search-live" id="searchLive"></div>
      </form>
      <div class="hero-trending">
        <span class="trending-label">Trending</span>
        <div class="trending-list" id="trendingList"></div>
      </div>
    </div>
  </section>

  <section class="strip">
    <div class="strip-inner">
      <div class="stat"><span class="stat-num">2,481,902</span><span class="stat-label">Names registered</span></div>
      <div class="stat"><span class="stat-num" id="statDefaultFee">—</span><span class="stat-label">Starting price / year</span></div>
    </div>
  </section>
</template>

<template id="tpl-search">
  <section class="page-search">
    <div class="page-inner">
      <form class="search-form search-form--compact" id="searchFormPage" autocomplete="off">
        <div class="search-box">
          <svg class="search-icon" width="18" height="18" viewBox="0 0 20 20" fill="none"><circle cx="9" cy="9" r="6.5" stroke="currentColor" stroke-width="1.6"/><path d="M14 14L18 18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <input type="text" id="searchInputPage" placeholder="Search for a name" spellcheck="false">
          <span class="search-suffix">.gen</span>
        </div>
      </form>
      <div class="results-head">
        <h2 id="resultsTitle">Results</h2>
        <div class="filter-row" id="filterRow">
          <button class="chip is-active" data-filter="all">All</button>
          <button class="chip" data-filter="available">Available</button>
          <button class="chip" data-filter="taken">Taken</button>
        </div>
      </div>
      <div class="results-list" id="resultsList"></div>
    </div>
  </section>
</template>

<template id="tpl-name">
  <section class="page-name">
    <div class="page-inner page-inner--narrow">
      <a href="#/" class="back-link" data-nav>&larr; Back to search</a>
      <div class="name-card" id="nameCard"></div>
    </div>
  </section>
</template>

<template id="tpl-register">
  <section class="page-register">
    <div class="page-inner page-inner--narrow">
      <div class="stepper" id="stepper"></div>
      <div class="register-panel" id="registerPanel"></div>
    </div>
  </section>
</template>

<template id="tpl-names">
  <section class="page-names">
    <div class="page-inner">
      <div class="page-head">
        <h1>My names</h1>
        <a href="#/" class="btn btn-primary" data-nav>Search names</a>
      </div>
      <div id="namesBody"></div>
    </div>
  </section>
</template>

<template id="tpl-profile">
  <section class="page-profile">
    <div class="page-inner page-inner--narrow" id="profileBody"></div>
  </section>
</template>

<template id="tpl-settings">
  <section class="page-settings">
    <div class="page-inner page-inner--narrow">
      <a href="#/names" class="back-link" data-nav>&larr; Back to my names</a>
      <div id="settingsBody"></div>
    </div>
  </section>
</template>

<template id="tpl-learn">
  <section class="page-learn">
    <div class="page-inner page-inner--narrow">
      <h1>How GenNS works</h1>
      <div class="faq" id="faqList"></div>
    </div>
  </section>
</template>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
</div>

<script type="module" src="mock-data.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
